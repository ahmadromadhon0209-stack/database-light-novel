:root{box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);--bg:#edf1f5;--card:#fff;--tx:#2e3a4b;--mu:#6b7a90;--bd:#dde4ec;--ac:#3db4f2;--ac2:#0a7bc0;color-scheme:light}

body{background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;min-height:100vh}
.card{background:var(--card);border:1px solid var(--bd);border-radius:12px}
.inp{background:var(--card);border:1px solid var(--bd);border-radius:8px;padding:.5rem .75rem;width:100%;color:var(--tx);font-size:.875rem}
.inp:focus{outline:2px solid var(--ac);outline-offset:-1px}
.btn{display:inline-flex;align-items:center;gap:.4rem;border-radius:8px;padding:.5rem .9rem;font-size:.875rem;font-weight:600;background:var(--ac);color:#062033;cursor:pointer;border:0}
.btn.sec{background:transparent;border:1px solid var(--bd);color:var(--tx)}
.btn.red{background:#e5484d;color:#fff}
.pill{font-size:.7rem;font-weight:700;padding:.15rem .5rem;border-radius:999px;display:inline-block}
.mu{color:var(--mu)}.ac{color:var(--ac2)}
.cov{aspect-ratio:2/3;background:linear-gradient(135deg,#3db4f2,#7c5cff);display:flex;align-items:center;justify-content:center;color:#fff;font-weight:800;font-size:2.5rem;overflow:hidden;position:relative}
.cov img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover}
.scroll{overflow-x:auto;max-width:100%}
th,td{padding:.5rem .6rem;text-align:left;font-size:.8rem;border-bottom:1px solid var(--bd);vertical-align:top}
.modal{position:fixed;inset:0;background:#0009;z-index:50;display:flex;align-items:flex-start;justify-content:center;overflow:auto;padding:1rem}
</style>

const FIELDS=[['judul','Judul'],['judulJp','Judul Jepang'],['penulis','Penulis'],['ilustrator','Ilustrator'],['penerbit','Penerbit'],['genre','Genre'],['status','Status'],['kategori','Kategori'],['volume','Nomor Volume'],['jumlah','Jumlah Volume'],['harga','Harga'],['cover','Cover URL'],['link','Link Shopee/Toko'],['sinopsis','Sinopsis'],['rilisTgl','Rilis Mendatang (tanggal)'],['rilisKet','Keterangan Rilis']];
const RX={judulJp:/jepang|romaji|original|asli/i,judul:/^judul|title/i,penulis:/author|penulis|pengarang/i,ilustrator:/ilustrator|illustrator/i,penerbit:/penerbit|publisher/i,genre:/genre/i,status:/status/i,kategori:/kategori/i,jumlah:/jumlah/i,volume:/^vol|jilid/i,harga:/harga|price/i,cover:/cover|sampul/i,link:/link|shopee|toko|beli/i,sinopsis:/sinopsis|synopsis/i,rilisTgl:/mendatang|tanggal|rilis/i,rilisKet:/keterangan|ket\b|catatan/i};
function autoMap(h){const m={};const used=new Set();for(const f of ['judulJp','jumlah','rilisKet','judul','penulis','ilustrator','penerbit','genre','status','kategori','volume','harga','cover','link','sinopsis','rilisTgl']){const i=h.findIndex((x,j)=>!used.has(j)&&RX[f].test(x));if(i>=0){m[f]=i;used.add(i)}}return m}
function readSheet(ws){
  if(!ws||!ws['!ref'])return{headers:[],rows:[]};
  const r=XLSX.utils.decode_range(ws['!ref']);const g=(R,C)=>{const c=ws[XLSX.utils.encode_cell({r:R,c:C})];if(!c)return'';
    if(c.f){const m=c.f.match(/"(https?:[^"]+)"/);if(m)return m[1]}return c.v==null?'':String(c.v).trim()};
  let hr=-1;for(let R=r.s.r;R<=r.e.r&&R<r.s.r+15;R++){let n=0;for(let C=r.s.c;C<=r.e.c;C++)if(g(R,C))n++;if(n>=3){hr=R;break}}
  if(hr<0)return{headers:[],rows:[]};
  const headers=[];for(let C=r.s.c;C<=r.e.c;C++)headers.push(g(hr,C)||'Kolom '+(C-r.s.c+1));
  const rows=[];for(let R=hr+1;R<=r.e.r;R++){const row=[];let any=false;for(let C=r.s.c;C<=r.e.c;C++){const v=g(R,C);if(v)any=true;row.push(v)}if(any)rows.push(row)}
  return{headers,rows};
}
function toSeries(rows,map,headers){
  const M={};const out=[];const v=(r,f)=>map[f]!=null?(r[map[f]]||'').replace(/\s+/g,' ').trim():'';
  for(const r of rows){let t=v(r,'judul');if(!t)continue;const k=t.toLowerCase();let s=M[k];
    if(!s){let jd=t,jp=v(r,'judulJp');const m=t.match(/^(.*?)\s*\(([^()]*)\)?\s*$/);if(m&&m[1]&&!jp){jd=m[1];jp=m[2]}
      s=M[k]={id:out.length+1,judul:jd,judulJp:jp,penulis:'',ilustrator:'',penerbit:'',genre:[],status:'',kategori:'',cover:'',sinopsis:'',rilis:null,vols:[]};out.push(s)}
    for(const f of ['penulis','ilustrator','penerbit','kategori','cover','sinopsis','status'])if(!s[f]&&v(r,f))s[f]=v(r,f);
    v(r,'genre').split(/[,;]/).map(x=>x.trim()).filter(Boolean).forEach(x=>{x=x[0].toUpperCase()+x.slice(1).toLowerCase();if(!s.genre.includes(x))s.genre.push(x)});
    if(v(r,'jumlah'))s.jumlah=parseInt(v(r,'jumlah'))||0;
    if(v(r,'rilisTgl')||v(r,'rilisKet'))s.rilis={tgl:fixDate(v(r,'rilisTgl')),ket:v(r,'rilisKet')};
    if(map.volume!=null||map.harga!=null||map.link!=null){const n=parseInt(v(r,'volume'))||s.vols.length+1;s.vols.push({n,harga:parseInt(String(v(r,'harga')).replace(/\D/g,''))||0,link:/^http/.test(v(r,'link'))?v(r,'link'):''})}}
  out.forEach(s=>{if(!s.status)s.status=/one-shot/i.test(s.kategori)?'Tamat':'Berlanjut';s.vols.sort((a,b)=>a.n-b.n)});
  return out;
}
function fixDate(x){if(!x)return'';if(/^\d{5}$/.test(x)){return new Date(Math.round((x-25569)*864e5)).toISOString().slice(0,10)}const d=new Date(x);return isNaN(d)?x:d.toISOString().slice(0,10)}
function exportXlsx(){
  const H=['JUDUL','JUDUL JEPANG','AUTHOR','ILUSTRATOR','COVER','KATEGORI','VOLUME','PENERBIT','GENRE','STATUS','HARGA RESMI','LINK PEMBELIAN','SINOPSIS','RILIS MENDATANG','KETERANGAN RILIS','JUMLAH VOLUME'];
  const A=[H];DB.forEach(s=>{const vs=s.vols.length?s.vols:[{n:'',harga:'',link:''}];vs.forEach((v,i)=>A.push([s.judul,s.judulJp,s.penulis,s.ilustrator,s.cover,s.kategori,v.n,s.penerbit,s.genre.join(', '),s.status,v.harga,v.link,i?'':s.sinopsis,i?'':(s.rilis?.tgl||''),i?'':(s.rilis?.ket||''),i?'':(s.jumlah||'')]))});
  const wb=XLSX.utils.book_new();XLSX.utils.book_append_sheet(wb,XLSX.utils.aoa_to_sheet(A),'DAFTAR ISI');XLSX.writeFile(wb,'database.xlsx');
}

  <label class="text-xs mu block">Status<select class="inp mt-1" data-k="status">${['Berlanjut','Tamat','Hiatus'].map(x=>`<option ${x===s.status?'selected':''}>${x}</option>`).join('')}</select></label>${f('kategori','Kategori',s.kategori)}${f('cover','Cover URL',s.cover)}${f('rilisTgl','Rilis Mendatang',s.rilis?.tgl||'','date')}<div class="sm:col-span-2">${f('rilisKet','Keterangan Rilis (mis. Vol. 7, pre-order)',s.rilis?.ket||'')}</div>
  <label class="text-xs mu block sm:col-span-2">Sinopsis<textarea class="inp mt-1" rows="3" data-k="sinopsis">${esc(s.sinopsis)}</textarea></label>
  <label class="text-xs mu block sm:col-span-2">Volume: satu baris per volume, format “nomor | harga | link Shopee/toko”<textarea class="inp mt-1 font-mono" rows="6" data-k="vols">${esc(s.vols.map(v=>[v.n,v.harga,v.link].join(' | ')).join('\n'))}</textarea></label></div>
  <div class="flex justify-end gap-2 mt-4"><button class="btn sec" data-act="close">Batal</button><button class="btn" data-act="saveform">Simpan</button></div></div></div>`;
}
function saveForm(){
  const g=k=>document.querySelector(`#frm [data-k="${k}"]`).value.trim();const id=+$('#frm').dataset.id;
  if(!g('judul'))return alert('Judul wajib diisi.');
  const old=DB.find(x=>x.id===id)||{};
  const vols=g('vols').split('\n').map(l=>l.split('|').map(x=>x.trim())).filter(a=>a[0]).map(a=>({n:parseInt(a[0])||0,harga:parseInt((a[1]||'').replace(/\D/g,''))||0,link:a[2]||''}));
  Store.upsert({...old,id,judul:g('judul'),judulJp:g('judulJp'),penulis:g('penulis'),ilustrator:g('ilustrator'),penerbit:g('penerbit'),genre:g('genre').split(',').map(x=>x.trim()).filter(Boolean),status:g('status'),kategori:g('kategori'),cover:g('cover'),sinopsis:g('sinopsis'),rilis:(g('rilisTgl')||g('rilisKet'))?{tgl:g('rilisTgl'),ket:g('rilisKet')}:null,vols});
  $('#modal').innerHTML='';render();
}

/* Impor Excel */
let IMP=null;
function impModal(){
  const I=IMP;let body=`<input type="file" id="ifile" accept=".xlsx,.xls" class="inp">`;
  if(I){const sh=I.wb.SheetNames;
    body+=`<label class="text-xs mu block mt-3">Pilih lembar kerja (sheet)<select class="inp mt-1" id="isheet">${sh.map(n=>`<option ${n===I.sheet?'selected':''}>${esc(n)}</option>`).join('')}</select></label>
    <p class="text-xs mu mt-3 mb-1">Petakan kolom Excel ke kolom aplikasi:</p><div class="grid sm:grid-cols-2 gap-2">${FIELDS.map(([k,l])=>`<label class="text-xs mu">${l}<select class="inp mt-1" data-m="${k}"><option value="">— tidak dipakai —</option>${I.headers.map((h,i)=>`<option value="${i}" ${I.map[k]===i?'selected':''}>${esc(h)}</option>`).join('')}</select></label>`).join('')}</div>
    <p class="text-xs mu mt-3 mb-1">Pratinjau ${Math.min(5,I.rows.length)} dari ${I.rows.length} baris:</p><div class="card scroll"><table><thead><tr>${I.headers.map(h=>`<th>${esc(h)}</th>`).join('')}</tr></thead><tbody>${I.rows.slice(0,5).map(r=>`<tr>${r.map(c=>`<td>${esc(String(c).slice(0,40))}</td>`).join('')}</tr>`).join('')}</tbody></table></div>
    <div class="flex gap-4 mt-3 text-sm"><label><input type="radio" name="imode" value="replace" ${I.mode==='replace'?'checked':''}> Ganti Semua Data</label><label><input type="radio" name="imode" value="merge" ${I.mode==='merge'?'checked':''}> Gabung/Update Data</label></div>`}
  $('#modal').innerHTML=`<div class="modal"><div class="card p-4 w-full max-w-3xl mt-4"><div class="flex justify-between mb-3"><h2 class="font-extrabold text-lg">Impor dari Excel</h2><button data-act="close" aria-label="Tutup">${ico('x')}</button></div>${body}<div class="flex justify-end gap-2 mt-4"><button class="btn sec" data-act="close">Batal</button>${I?'<button class="btn" data-act="doimp">Impor Sekarang</button>':''}</div></div></div>`;
}
function loadSheet(name){const d=readSheet(IMP.wb.Sheets[name]);Object.assign(IMP,{sheet:name,headers:d.headers,rows:d.rows,map:autoMap(d.headers)})}
function doImport(){
  const map={};document.querySelectorAll('[data-m]').forEach(s=>{if(s.value!=='')map[s.dataset.m]=+s.value});
  if(map.judul==null)return alert('Kolom Judul wajib dipetakan.');
  const mode=document.querySelector('[name=imode]:checked').value;const ns=toSeries(IMP.rows,map,IMP.headers);
  if(mode==='replace')DB=ns.map((s,i)=>({...s,id:i+1}));
  else ns.forEach(n=>{const o=DB.find(x=>x.judul.toLowerCase()===n.judul.toLowerCase());if(!o){DB.push({...n,id:Store.nextId()});return}
    for(const k of ['judulJp','penulis','ilustrator','penerbit','kategori','cover','sinopsis','rilis','jumlah'])if(n[k])o[k]=n[k];
    if(n.genre.length)o.genre=n.genre;n.vols.forEach(v=>{const e=o.vols.find(x=>x.n===v.n);e?Object.assign(e,v):o.vols.push(v)});o.vols.sort((a,b)=>a.n-b.n)});
  Store.save();IMP=null;$('#modal').innerHTML='';render();alert('Impor selesai: '+ns.length+' seri diproses.');
}

/* ===== Router & events ===== */
function render(){
  const h=location.hash.slice(1)||'beranda';route=h.startsWith('seri-')?'seri':h;
  navbar();let v;
  if(route==='seri')v=viewDetail(h.slice(5));else if(route==='jadwal')v=viewJadwal();else if(route==='admin-login')v=admin?(go('admin'),''):viewLogin();else if(route==='admin')v=viewAdmin();else v=viewHome();
  $('#app').innerHTML=v;scrollTo(0,0);
}
window.addEventListener('hashchange',render);
document.addEventListener('input',e=>{
  if(e.target.id==='q'){R.q=e.target.value;$('#grid').innerHTML=grid(list())}
  if(e.target.id==='aq')$('#atb').innerHTML=adminRows(e.target.value.toLowerCase());
});
document.addEventListener('change',async e=>{
  const t=e.target;
  if(t.dataset.f){R[t.dataset.f]=t.value;const y=window.scrollY;$('#app').innerHTML=viewHome();scrollTo(0,y)}
  if(t.id==='ifile'&&t.files[0]){try{const wb=XLSX.read(await t.files[0].arrayBuffer(),{type:'array'});IMP={wb,mode:'merge'};loadSheet(wb.SheetNames.find(n=>readSheet(wb.Sheets[n]).rows.length)||wb.SheetNames[0]);impModal()}catch(err){alert('File Excel tidak dapat dibaca.')}}
  if(t.id==='isheet'){loadSheet(t.value);impModal()}
  if(t.name==='imode')IMP.mode=t.value;
  if(t.dataset.m!==undefined)IMP.map[t.dataset.m]=t.value===''?undefined:+t.value;
});
document.addEventListener('click',e=>{
  const b=e.target.closest('[data-act]');if(!b)return;const a=b.dataset.act,id=+b.dataset.id;
  if(a==='theme')setTheme(!dark),navbar();
  else if(a==='demo'||a==='login'){const ok=a==='demo'||($('#lu').value==='admin'&&$('#lp').value==='admin123');if(!ok)return $('#le').textContent='Nama pengguna atau kata sandi salah.';admin=true;try{sessionStorage.setItem('ln_admin','1')}catch(x){}go('admin');render()}
  else if(a==='logout'){admin=false;try{sessionStorage.removeItem('ln_admin')}catch(x){}go('beranda')}
  else if(a==='add')formModal(0);else if(a==='edit')formModal(id);
  else if(a==='del'){if(confirm('Hapus seri ini beserta semua volumenya?')){Store.remove(id);render()}}
  else if(a==='saveform')saveForm();
  else if(a==='close'){IMP=null;$('#modal').innerHTML=''}
  else if(a==='imp'){IMP=null;impModal()}else if(a==='doimp')doImport();
  else if(a==='exp')exportXlsx();
  else if(a==='reset'){if(confirm('Kembalikan ke data awal dan hapus semua perubahan?')){try{localStorage.removeItem(Store.K)}catch(x){}Store.init().then(d=>{DB=d;render()})}}
});
(async()=>{
  try{setTheme(localStorage.getItem('ln_theme')?localStorage.getItem('ln_theme')==='dark':matchMedia('(prefers-color-scheme: dark)').matches)}catch(e){}
  DB=await Store.init();render();
})();
</script>
</body>
</html>
